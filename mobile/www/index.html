<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>roadSOS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:grid;place-items:center;height:100vh;margin:0;
         background:#f6f3ee;color:#1d1b18;text-align:center;padding:20px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;
         background:#eaa66a;margin-right:8px;animation:pulse 1.2s infinite ease}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}
    p.sub{opacity:.55;font-size:13px;margin-top:8px;max-width:300px;line-height:1.5}
  </style>
</head>
<body>
  <div>
    <p style="font-size:18px;font-weight:600;margin:0"><span class="dot"></span>Connecting to roadSOS&hellip;</p>
    <p class="sub">Make sure your laptop is on the same Wi-Fi and the Flask dev server is running.</p>
  </div>
  <script>setTimeout(function(){ location.reload(); }, 5000);</script>
</body>
</html>
