<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'partials/_head.html' %}
</head>
<body>
  <!-- Background ambient circles -->
  <div class="bg-drift-circle bg-drift-circle-primary"></div>
  <div class="bg-drift-circle bg-drift-circle-cyan"></div>

  <!-- ==========================================================================
       Split-Screen Portal Setup
       ========================================================================== -->
  <div class="auth-wrapper flex">
    <!-- Left Visual Panel: Premium Telemetry Map & Active Rescue Simulation -->
    <div class="auth-visual-panel flex-col flex-1 relative justify-between p-12">
      <!-- Top header brand -->
      <a href="/" class="flex items-center gap-3 font-headings font-bold text-2xl text-gradient-red z-10" id="visual-brand">
        <i class="fa-solid fa-truck-monster fa-beat text-danger"></i>
        <span>road<span style="color: var(--text)">SOS</span></span>
      </a>

      <!-- Center high-tech vehicle breakdown telemetry widget -->
      <div class="telemetry-widget glass p-6 z-10 relative" style="border-radius: var(--radius-md)">
        <div class="radar-container mb-4 relative overflow-hidden" style="height: 120px; border-radius: var(--radius-sm); background: #070a12; border: 1px solid var(--surface-border)">
          <div class="radar-line"></div>
          <div class="radar-ping text-danger" style="top: 30%; left: 45%"><i class="fa-solid fa-location-dot"></i></div>
          <div class="radar-ping text-success" style="top: 60%; left: 75%; animation-delay: 1s;"><i class="fa-solid fa-truck-pickup"></i></div>
          <div class="radar-grid"></div>
        </div>
        
        <div class="flex flex-col gap-2">
          <span class="text-xs uppercase tracking-wider text-muted font-semibold"><i class="fa-solid fa-compass mr-1"></i> Emergency Beacon Signal</span>
          <div class="flex items-center justify-between mt-1">
            <span class="text-sm font-medium">Beacons Dispatched:</span>
            <span class="text-sm font-bold text-gradient">24.0894° N, 82.3045° E</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium">Nearest Rescuer:</span>
            <span class="text-sm font-bold text-success"><i class="fa-solid fa-truck-pickup"></i> Rescuer-42 (2.4 miles)</span>
          </div>
        </div>
      </div>

      <!-- Bottom footer stats -->
      <div class="flex items-center gap-8 z-10">
        <div class="flex flex-col">
          <span class="text-2xl font-headings font-bold text-gradient">14.5m</span>
          <span class="text-xs text-muted uppercase tracking-wider">Avg Dispatch</span>
        </div>
        <div class="flex flex-col">
          <span class="text-2xl font-headings font-bold text-gradient">99.8%</span>
          <span class="text-xs text-muted uppercase tracking-wider">Rescue Rate</span>
        </div>
        <div class="flex flex-col">
          <span class="text-2xl font-headings font-bold text-gradient">1.4K+</span>
          <span class="text-xs text-muted uppercase tracking-wider">Local Fleets</span>
        </div>
      </div>
    </div>

    <!-- Right Interaction Panel: Frosted Glass Form Card Container -->
    <div class="auth-form-panel flex justify-center items-center p-6 relative">
      <div class="glass-card max-w-md w-full p-8 z-10">
        <!-- Render Flask Page Content here -->
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Special structural styles for the splitauth layout -->
  <style>
    .auth-wrapper {
      min-height: 100vh;
      width: 100%;
      background-color: var(--background);
    }
    .auth-visual-panel {
      background: linear-gradient(180deg, rgba(11, 15, 25, 0.4) 0%, rgba(7, 10, 18, 0.9) 100%), 
                  url("https://images.unsplash.com/photo-1518386180577-b38340d89006?auto=format&fit=crop&q=80&w=1200");
      background-size: cover;
      background-position: center;
      border-right: 1px solid var(--surface-border);
    }
    .auth-form-panel {
      width: 480px;
      flex-shrink: 0;
      background-color: hsl(var(--bg-hue), var(--bg-saturation), 5%);
    }
    
    /* Radar Telemetry widget details */
    .radar-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 15px 15px;
      pointer-events: none;
    }
    .radar-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--primary) 50%, transparent 100%);
      top: 0;
      animation: radar-sweep 4s infinite linear;
      opacity: 0.7;
    }
    .radar-ping {
      position: absolute;
      font-size: var(--text-sm);
      animation: ping-pulse 2s infinite ease-in-out;
    }
    @keyframes radar-sweep {
      0% { top: 0; }
      100% { top: 120px; }
    }
    @keyframes ping-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor); }
      50% { transform: scale(1.4); filter: drop-shadow(0 0 8px currentColor); }
    }

    /* Tablet/Mobile Responsive adjustments */
    @media (max-width: 1024px) {
      .auth-visual-panel {
        display: none !important;
      }
      .auth-form-panel {
        width: 100%;
      }
    }
  </style>

  {% include 'partials/_scripts.html' %}
</body>
</html>
