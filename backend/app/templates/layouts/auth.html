<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'partials/_head.html' %}
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a href="{{ url_for('home.index') }}" class="auth-brand">
        <span class="auth-brand__dot"></span>
        <span>road<strong>SOS</strong></span>
      </a>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flex flex-col gap-2 mb-4">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">
                <span>{{ message }}</span>
                <button class="flash__dismiss" onclick="this.parentElement.remove()">×</button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </div>

  <style>
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: var(--background);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--space-8);
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-headings);
      font-size: var(--text-lg);
      color: var(--text-strong);
      margin-bottom: var(--space-6);
    }
    .auth-brand__dot {
      width: 14px;
      height: 14px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-ring);
    }
    .auth-brand strong { font-weight: var(--weight-bold); }

    .flash {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: var(--text-sm);
      color: var(--text);
    }
    .flash-success { background: var(--success-soft); border-color: transparent; color: var(--success); }
    .flash-warning { background: var(--warning-soft); border-color: transparent; color: #8a5a14; }
    .flash-error,
    .flash-danger  { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
    .flash__dismiss { background: none; border: 0; color: inherit; font-size: 22px; cursor: pointer; }
  </style>

  {% include 'partials/_scripts.html' %}
</body>
</html>
