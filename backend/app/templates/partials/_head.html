<!-- _head.html - Unified Head Configurations -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<!-- Primary SEO Meta Tags -->
<title>{% block title %}roadSOS | Premium Roadside Assistance & Emergency Rescue{% endblock %}</title>
<meta name="title" content="{% block seo_title %}roadSOS - Real-Time Roadside Assistance and Breakdown Dispatch{% endblock %}">
<meta name="description" content="{% block seo_description %}Get immediate, high-priority roadside assistance for flat tires, dead batteries, lockouts, fuel delivery, and emergency towing. roadSOS connects you to certified local rescuers in real-time.{% endblock %}">
<meta name="robots" content="index, follow">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:title" content="roadSOS - Premium Emergency Roadside Rescue">
<meta property="og:description" content="Initiate instant GPS-tracked emergency vehicle rescues, towing support, lockouts, and engine help. Certified rescuers dispatched in seconds.">
<meta property="og:image" content="{{ url_for('static', filename='images/og_card.jpg') }}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="roadSOS - Premium Emergency Roadside Rescue">
<meta property="twitter:description" content="Initiate instant GPS-tracked emergency vehicle rescues, towing support, lockouts, and engine help. Certified rescuers dispatched in seconds.">

<!-- Modern Google Fonts Integration (Outfit for headings, Inter for body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- High-Tech Icons - FontAwesome and Font Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Master CSS Pipeline -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<!-- Extra page-specific styling blocks -->
{% block head_extra %}{% endblock %}
